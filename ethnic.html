<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ethnic Wear | Prasads Bespoke</title>
<meta name="description" content="Kurtas, sherwanis, sadris and Nehru jackets, bandhgalas and indo-western, made to your measure by Prasads Bespoke.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap">
<style>
  :root{
    --ink:#0c0805; --gold:#d9b48a; --gold-2:#e8cfae; --gold-deep:#b08d66;
    --white:#ffffff; --muted:rgba(255,255,255,.62); --dim:rgba(255,255,255,.28);
    --serif:"Cormorant Garamond",serif; --sans:"Montserrat",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;overflow-x:clip;height:100%;background:var(--ink);color:var(--white);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

  /* ── stage ── */
  .eth{position:relative;overflow:clip;height:100vh;height:100svh;min-height:600px}
  .eth__bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.08);
    transition:opacity 1.1s ease,transform 6s ease}
  .eth__bg.on{opacity:1;transform:scale(1)}
  .eth__shade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to right,rgba(12,8,5,.88) 0%,rgba(12,8,5,.55) 40%,rgba(12,8,5,.15) 75%,rgba(12,8,5,.35) 100%),
               linear-gradient(to bottom,rgba(12,8,5,.55) 0%,rgba(12,8,5,0) 25%,rgba(12,8,5,0) 70%,rgba(12,8,5,.6) 100%)}

  /* ── top bar ── */
  .eth__bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:26px 5vw}
  .eth__back{display:inline-flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);transition:color .3s}
  .eth__back:hover{color:var(--white)}
  .eth__back i{width:34px;height:34px;border:1px solid rgba(255,255,255,.35);border-radius:50%;display:grid;place-items:center;font-style:normal}
  .eth__brand{display:flex;flex-direction:column;align-items:center;line-height:1}
  .eth__brand b{font-family:var(--serif);font-weight:400;font-size:clamp(22px,2vw,30px);letter-spacing:.06em}
  .eth__brand small{font-size:8px;letter-spacing:.6em;margin-right:-.6em;margin-top:6px}
  .eth__book{font-size:11px;letter-spacing:.3em;text-transform:uppercase;padding:12px 22px;border:1px solid rgba(232,207,174,.55);border-radius:999px;transition:background .3s,color .3s}
  .eth__book:hover{background:var(--gold-2);color:var(--ink)}

  /* ── left info ── */
  .eth__info{position:absolute;right:5vw;bottom:9vh;z-index:3;max-width:36vw;text-align:right}
  .eth__eye{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
  .eth__count{font-family:var(--serif);font-size:clamp(54px,6vw,96px);line-height:1;margin:14px 0 10px;font-weight:300}
  .eth__count span{font-size:.38em;color:var(--muted)}
  .eth__for{margin-top:10px;font-family:var(--serif);font-style:italic;font-size:clamp(16px,1.25vw,20px);color:var(--gold-2)}
  .eth__desc{font-family:var(--serif);font-style:italic;font-size:clamp(17px,1.4vw,22px);line-height:1.45;color:var(--muted);margin:0;min-height:3em;transition:opacity .4s}

  /* ── right title list ── */
  .eth__list{position:absolute;left:5vw;top:50%;transform:translateY(-46%);z-index:3;list-style:none;margin:0;padding:0;text-align:left;
    transition:opacity .5s ease,transform .6s var(--ease)}
  .eth.is-open .eth__info{opacity:0;pointer-events:none}
  .eth__info{transition:opacity .5s ease}
  .eth__item{opacity:0;transform:translateX(60px);transition:opacity .7s ease,transform .9s var(--ease);transition-delay:calc(var(--i) * 150ms)}
  .eth.is-ready .eth__item{opacity:1;transform:none}
  .eth__t{display:inline-flex;align-items:baseline;gap:18px;font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.2vw,56px);line-height:1.08;text-align:left;color:var(--white);transition:color .4s,opacity .4s,transform .5s var(--ease)}
  .eth__t sup{font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--gold);transform:translateY(-1.6em)}
  .eth__list.has-active .eth__t{opacity:.32}
  .eth__item.active .eth__t{opacity:1;color:var(--gold-2);transform:translateX(14px)}
  .eth__more{display:block;margin-right:auto;overflow:hidden;max-height:0;opacity:0;transition:max-height .5s var(--ease),opacity .4s ease,margin .5s var(--ease)}
  .eth__item.active .eth__more{max-height:40px;opacity:1;margin:4px auto 14px 14px}
  .eth__more span{display:inline-flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--white);padding-bottom:6px;border-bottom:1px solid var(--gold)}
  .eth__more span::after{content:"→";letter-spacing:0;transition:transform .3s}
  .eth__more:hover span::after{transform:translateX(5px)}

  /* ── product panel (left half) ── */
  .eth__panel{position:absolute;top:0;right:0;bottom:0;width:68%;z-index:4;padding:110px 4vw 0 9vw;display:flex;flex-direction:column;
    background:rgba(12,8,5,.45);-webkit-backdrop-filter:blur(18px) saturate(130%);backdrop-filter:blur(18px) saturate(130%);
    border:0;-webkit-mask-image:linear-gradient(to right,transparent 0%,#000 16%);mask-image:linear-gradient(to right,transparent 0%,#000 16%);
    transform:translateX(100%);visibility:hidden;transition:transform .8s var(--ease),visibility 0s linear .8s}
  .eth.is-open .eth__panel{transform:none;visibility:visible;transition:transform .8s var(--ease)}
  .eth__ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
  .eth__ph h2{transition:opacity .3s;font-family:var(--serif);font-weight:400;font-size:clamp(34px,3.4vw,56px);line-height:1;margin:6px 0 0}
  .eth__close{width:44px;height:44px;flex:none;border:1px solid rgba(255,255,255,.35);border-radius:50%;display:grid;place-items:center;font-size:18px;transition:background .3s,color .3s}
  .eth__close:hover{background:var(--gold-2);color:var(--ink)}
  .eth__grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:auto;align-content:start;gap:40px 24px;overflow-y:auto;overscroll-behavior:contain;padding:0 12px 80px 0;-webkit-mask-image:linear-gradient(to bottom,#000 86%,transparent 100%);mask-image:linear-gradient(to bottom,#000 86%,transparent 100%)}
  .eth__card{display:block;opacity:0;transform:translateY(30px);transition:opacity .6s ease,transform .8s var(--ease)}
  .eth__grid.show .eth__card{opacity:1;transform:none;transition-delay:calc(.2s + min(var(--i), 5) * 150ms)}
  .eth__item.opened .eth__t{color:var(--gold-2)}
  .eth__card figure{position:relative;height:0;padding-bottom:160%;margin:0;overflow:hidden;border-radius:4px}
  .eth__card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease)}
  .eth__card:hover img{transform:scale(1.06)}
  .eth__card hr{border:0;height:1px;margin:14px 0 10px;background:linear-gradient(90deg,var(--gold-deep),var(--gold-2),var(--gold-deep))}
  .eth__card h3{font-family:var(--serif);font-weight:400;font-size:clamp(17px,1.35vw,22px);margin:0;letter-spacing:.02em}

  /* ── phones ── */
  @media (max-width:760px){
    .eth__bar{padding:18px 20px}
    .eth__back b,.eth__book{display:none}
    .eth__info{left:20px;right:20px;bottom:auto;top:92px;max-width:none;text-align:left}
    .eth__count{font-size:44px;margin:8px 0 4px}
    .eth__desc{font-size:15px;min-height:0}
    .eth__shade{background:linear-gradient(to bottom,rgba(12,8,5,.75) 0%,rgba(12,8,5,.35) 45%,rgba(12,8,5,.85) 100%)}
    .eth__list{right:20px;left:20px;top:auto;bottom:6vh;transform:none}
    .eth__t{font-size:38px}
    .eth.is-open .eth__t{font-size:24px}
    .eth.is-open .eth__more,.eth.is-open .eth__t sup{display:none}
    .eth__brand{position:absolute;left:50%;transform:translateX(-50%)}
    .eth__panel{width:100%;bottom:auto;height:60%;padding:80px 20px 16px;border-bottom:0;transform:translateY(-100%);-webkit-mask-image:linear-gradient(to bottom,#000 82%,transparent 100%);mask-image:linear-gradient(to bottom,#000 82%,transparent 100%)}
    .eth__ph{margin-bottom:14px}
    .eth__ph h2{font-size:28px}
    .eth__grid{gap:22px 12px;grid-template-columns:repeat(2,1fr)}
    .eth__card hr{margin:8px 0 6px}
    .eth__card h3{font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important}}
</style>
<style>
  /* card photo slider (hover) */
  .eth__card figure{position:relative;height:0;padding-bottom:160%;overflow:hidden}
  .eth__slides{position:absolute;inset:0;display:flex;transition:transform .8s cubic-bezier(.22,1,.36,1)}
  .eth__slides img{position:relative!important;inset:auto!important;flex:0 0 100%;width:100%!important;height:100%!important;object-fit:cover}

  /* lightbox */
  .lb{position:fixed;inset:0;z-index:9995;display:flex;flex-direction:column;background:rgba(10,7,4,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
  .lb.open{opacity:1;visibility:visible;transition:opacity .45s ease}
  .lb__stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:70px 90px 10px}
  .lb__img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.5);transform:scale(.97);opacity:0}
  .lb__img.in{animation:lbIn .6s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes lbIn{to{transform:none;opacity:1}}
  .lb__arrow,.lb__close{position:absolute;width:52px;height:52px;border-radius:50%;border:1px solid rgba(232,207,174,.5);background:rgba(20,14,10,.4);color:#f3dcc0;font-size:20px;display:grid;place-items:center;transition:background .3s,color .3s}
  .lb__arrow:hover,.lb__close:hover{background:#e8cfae;color:#0c0805}
  .lb__arrow{top:50%;transform:translateY(-50%)}
  .lb__arrow.--prev{left:24px}.lb__arrow.--next{right:24px}
  .lb__close{top:22px;right:24px;width:46px;height:46px;font-size:16px}
  .lb.one .lb__arrow,.lb.one .lb__thumbs{display:none}
  .lb__bar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 5vw 26px;border-top:1px solid rgba(232,207,174,.18)}
  .lb__count{display:block;font-family:"Montserrat",sans-serif;font-size:10px;letter-spacing:.3em;color:#d9b48a;margin-bottom:6px}
  .lb__name{margin:0;font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(22px,2vw,32px);color:#fff}
  .lb__thumbs{display:flex;gap:10px}
  .lb__thumbs button{width:52px;height:70px;padding:0;border:1px solid transparent;border-radius:3px;overflow:hidden;opacity:.5;transition:opacity .3s,border-color .3s}
  .lb__thumbs button.on{opacity:1;border-color:#e8cfae}
  .lb__thumbs img{width:100%;height:100%;object-fit:cover;display:block}
  .lb__book{flex:none;font-family:"Montserrat",sans-serif;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#f3dcc0;padding:13px 24px;border:1px solid rgba(232,207,174,.6);border-radius:999px;text-decoration:none;transition:background .3s,color .3s}
  .lb__book:hover{background:#e8cfae;color:#0c0805}
  @media (max-width:760px){
    .lb__stage{padding:64px 12px 8px}
    .lb__arrow{display:none}
    .lb__bar{flex-wrap:wrap;gap:14px;padding:14px 16px 20px}
    .lb__thumbs{order:3;width:100%}
    .lb__thumbs button{width:44px;height:58px}
  }
</style>
<style>
  /* ── loading screen ── */
  .pl{position:fixed;inset:0;z-index:100;pointer-events:none}
  .pl__half{position:absolute;top:0;bottom:0;width:50.5%;background:#0c0805;transition:transform 1.1s cubic-bezier(.77,0,.18,1)}
  .pl__half.--l{left:0}.pl__half.--r{right:0}
  .pl.is-done .pl__half.--l{transform:translateX(-100%)}
  .pl.is-done .pl__half.--r{transform:translateX(100%)}
  .pl__brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;text-align:center;white-space:nowrap;transition:opacity .5s ease}
  .pl.is-done .pl__brand,.pl.is-done .pl__pct{opacity:0}
  .pl__brand > span{opacity:0;animation:plRise 1.1s cubic-bezier(.22,1,.36,1) forwards}
  .pl__name{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(40px,7vw,104px);line-height:1;letter-spacing:.04em;background:linear-gradient(100deg,#d8b48a 0%,#f3dcc0 45%,#c9a07a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .pl__sub{font-family:"Montserrat",sans-serif;font-weight:300;font-size:clamp(11px,1.4vw,22px);letter-spacing:.62em;margin-right:-.62em;margin-top:clamp(8px,1vw,18px);color:#ead6bf;animation-delay:150ms!important}
  .pl__tag{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(9px,.8vw,13px);text-transform:uppercase;letter-spacing:.28em;margin-right:-.28em;margin-top:clamp(14px,1.8vw,30px);color:#bfa182;animation-delay:300ms!important}
  .pl__pct{position:absolute;left:50%;bottom:8vh;transform:translateX(-50%);font-family:"Montserrat",sans-serif;font-size:11px;letter-spacing:.32em;color:#bfa182;transition:opacity .4s ease}
  .pl.is-gone{display:none}
  @keyframes plRise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}

  /* ── cursor: identical to the main site (glass square + gold ribbon) ── */
  .cur,.cur__ring,.cur__tail,.cur__sq,.cur__trail{display:none!important}
</style>
<style>
  /* hide every scrollbar (scrolling still works) */
  html, body, * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
  html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }

<style>
/* ── phone catalogue: full screen, 4 at a time, swipeable cards, full-screen viewer ── */
.eth__chips,.eth__dots{display:none}
@media (max-width:760px){
  .eth__panel{height:auto;top:0;bottom:0;padding:74px 16px 0;-webkit-mask-image:none;mask-image:none;background:linear-gradient(180deg,rgba(12,8,5,.985) 0%,rgba(12,8,5,.96) 100%)}
  .eth.is-open .eth__list,.eth.is-open .eth__info{opacity:0;pointer-events:none;transition:opacity .35s}
  .eth__ph{margin-bottom:12px}
  .eth__chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .eth__chips::-webkit-scrollbar{display:none}
  .eth__chips button{flex:none;padding:8px 14px;border:1px solid rgba(232,207,174,.38);border-radius:999px;font-family:"Montserrat",sans-serif;font-size:11px;letter-spacing:.06em;color:#e8cfae;white-space:nowrap;background:transparent}
  .eth__chips button.on{background:#e8cfae;color:#0c0805;border-color:#e8cfae}
  .eth__grid{gap:16px 10px;padding:0 0 110px}
  .eth__card figure{padding-bottom:0;height:calc((100vh - 272px) / 2);height:calc((100dvh - 272px) / 2);min-height:170px;touch-action:pan-y}
  .eth__card figure img{object-position:50% 12%}
  .eth__grid .eth__card.is-live img,.eth__grid .eth__card:hover img{transform:none!important}
  .eth__card h3{font-size:13.5px}
  .eth__card hr{margin:7px 0 5px}
  .eth__dots{display:flex;position:absolute;left:0;right:0;bottom:8px;z-index:2;justify-content:center;gap:5px;pointer-events:none}
  .eth__dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45);transition:background .3s,transform .3s}
  .eth__dots i.on{background:#fff;transform:scale(1.25)}
  .lb{display:none!important}
}
.fv{position:fixed;inset:0;z-index:10000;background:#060403;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s;touch-action:none;overflow:hidden}
.fv.open{opacity:1;visibility:visible;transition:opacity .3s ease}
.fv__img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;will-change:transform;-webkit-user-drag:none;user-select:none}
.fv__img.--anim{transition:transform .32s cubic-bezier(.22,1,.36,1),opacity .32s}
.fv__top,.fv__cap{position:absolute;left:0;right:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:16px 16px;transition:opacity .3s}
.fv__top{top:0;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent)}
.fv__cap{bottom:0;flex-direction:column;align-items:flex-start;gap:6px;padding:40px 18px 26px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent)}
.fv.hide-ui .fv__top,.fv.hide-ui .fv__cap{opacity:0;pointer-events:none}
.fv__count{font-family:"Montserrat",sans-serif;font-size:11px;letter-spacing:.24em;color:#e8cfae}
.fv__close{width:42px;height:42px;border-radius:50%;border:1px solid rgba(232,207,174,.5);background:rgba(20,14,10,.5);color:#f3dcc0;font-size:15px;display:grid;place-items:center}
.fv__name{margin:0;font-family:"Cormorant Garamond",serif;font-weight:400;font-size:26px;color:#fff}
.fv__hint{font-family:"Montserrat",sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(232,207,174,.7)}
</style>
</head>
<body>
<div class="pl" id="pl" aria-hidden="true">
  <div class="pl__half --l"></div><div class="pl__half --r"></div>
  <div class="pl__brand"><span class="pl__name">PRASAD’S</span><span class="pl__sub">BESPOKE</span><span class="pl__tag">Hyderabad’s finest handcrafted couture</span></div>
  <div class="pl__pct" id="plPct">0%</div>
</div>
<div class="cur" id="cur"></div><div class="cur__ring" id="curRing"></div>

<section class="eth" id="eth" aria-label="Ethnic wear collection">
  <div class="eth__bg on" data-layer></div>
  <div class="eth__bg" data-layer></div>
  <div class="eth__shade"></div>

  <header class="eth__bar">
    <a class="eth__back" href="./index.html"><i>←</i><b>Back to the house</b></a>
    <a class="eth__brand" href="./index.html" aria-label="Prasad's Bespoke, home"><b>PRASAD’S</b><small>BESPOKE</small></a>
    <a class="eth__book" href="./index.html#contact">Book an appointment</a>
  </header>

  <div class="eth__info">
    <div class="eth__eye">Wedding &amp; festive collection</div>
    <div class="eth__for">For the groom, his father &amp; brothers</div>
    <div class="eth__count"><b id="ethNum">01</b> <span>/ 05</span></div>
    <p class="eth__desc" id="ethDesc"></p>
  </div>

  <ul class="eth__list" id="ethList"></ul>

  <aside class="eth__panel" id="ethPanel" aria-hidden="true">
    <div class="eth__ph">
      <div><div class="eth__eye">The selection</div><h2 id="ethPanelTitle"></h2></div>
      <button class="eth__close" id="ethClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="eth__chips" id="ethChips"></div>
    <div class="eth__grid" id="ethGrid"></div>
  </aside>
</section>

<div class="fv" id="fv" role="dialog" aria-modal="true" aria-label="Outfit photo" aria-hidden="true">
  <img class="fv__img" id="fvImg" src="" alt="">
  <div class="fv__top"><span class="fv__count" id="fvCount"></span><button class="fv__close" id="fvClose" type="button" aria-label="Close">✕</button></div>
  <div class="fv__cap"><h3 class="fv__name" id="fvName"></h3><span class="fv__hint" id="fvHint">Swipe for more views &middot; swipe down to close</span></div>
</div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Outfit photos" aria-hidden="true">
  <div class="lb__stage">
    <button class="lb__arrow --prev" id="lbPrev" type="button" aria-label="Previous photo">←</button>
    <img class="lb__img" id="lbImg" src="" alt="">
    <button class="lb__arrow --next" id="lbNext" type="button" aria-label="Next photo">→</button>
  </div>
  <div class="lb__bar">
    <div class="lb__info"><span class="lb__count" id="lbCount"></span><h3 class="lb__name" id="lbName"></h3></div>
    <div class="lb__thumbs" id="lbThumbs"></div>
    <a class="lb__book" href="./index.html#contact">Book an appointment</a>
  </div>
  <button class="lb__close" id="lbClose" type="button" aria-label="Close">✕</button>
</div>
<script>
(function () {

     items: the 4 products shown after "Know more" (name + photo) */
  var DATA = [
    { id:'kurtas', title:'Kurtas', desc:'Easy, elegant and cut to you. From everyday linen to festive silk.',

        ['Sherwani No. 02', ['./images/ethnic/sherwanis/sherwani%202a.webp','./images/ethnic/sherwanis/sherwani%202b.webp','./images/ethnic/sherwanis/sherwani%202c.webp']],
        ['Sherwani No. 03', ['./images/ethnic/sherwanis/sherwani%203a.webp','./images/ethnic/sherwanis/sherwani%203b.webp','./images/ethnic/sherwanis/sherwani%203c.webp']],
        ['Sherwani No. 04', ['./images/ethnic/sherwanis/sherwani%204a.webp','./images/ethnic/sherwanis/sherwani%204b.webp','./images/ethnic/sherwanis/sherwani%204c.webp']]
      ] },
    { id:'sadri-nehru-jackets', title:'Sadri / Nehru Jackets', one:'sadri and Nehru jacket', desc:'A sleeveless layer that lifts any kurta, from office to celebration.',
      bg:'', soon:true, items:[] },
    { id:'bandhgalas', title:'Bandhgalas', desc:'Indian formal at its finest. Structured, minimal and quietly grand.',
      bg:'./images/ethnic/bg/bandhgalas.webp', pos:'72% center',
      items:[
        ['Bandhgala No. 01', ['./images/ethnic/bandhgalas/bandhgala%201a.webp','./images/ethnic/bandhgalas/bandhgala%201b.webp','./images/ethnic/bandhgalas/bandhgala%201c.webp','./images/ethnic/bandhgalas/bandhgala%201d.webp']],
        ['Bandhgala No. 02', ['./images/ethnic/bandhgalas/bandhgala%202a.webp','./images/ethnic/bandhgalas/bandhgala%202b.webp','./images/ethnic/bandhgalas/bandhgala%202c.webp']],
        ['Bandhgala No. 03', ['./images/ethnic/bandhgalas/bandhgala%203a.webp','./images/ethnic/bandhgalas/bandhgala%203b.webp','./images/ethnic/bandhgalas/bandhgala%203c.webp']],

        ['Bandhgala No. 05', ['./images/ethnic/bandhgalas/bandhgala%205a.webp','./images/ethnic/bandhgalas/bandhgala%205b.webp','./images/ethnic/bandhgalas/bandhgala%205c.webp']],
        ['Bandhgala No. 06', ['./images/ethnic/bandhgalas/bandhgala%206a.webp','./images/ethnic/bandhgalas/bandhgala%206b.webp','./images/ethnic/bandhgalas/bandhgala%206c.webp']]

    { id:'indo-western', title:'Indo-Western', desc:'Tradition, recut. Drapes, capes and modern silhouettes for the new function.',

  var grid = document.getElementById('ethGrid');

  var current = -1, front = 0, openIdx = -1;

  // preload backgrounds
  DATA.forEach(function (d) { if (d.bg) { var im = new Image(); im.src = d.bg; } });

  // build the title list
  DATA.forEach(function (d, i) {
    var li = document.createElement('li');
    li.className = 'eth__item'; li.style.setProperty('--i', i); li.id = d.id;

                   '<button type="button" class="eth__more" tabindex="-1"><span>Know more</span></button>';

    });

  });

  function activate(i) {

      li.querySelector('.eth__more').tabIndex = k === i ? 0 : -1;
    });
    var back = layers[1 - front];
    back.style.backgroundImage = DATA[i].bg ? 'url("' + DATA[i].bg + '")' : 'radial-gradient(120% 90% at 70% 40%, #3a2a1f 0%, #120c08 70%)'; back.style.backgroundPosition = DATA[i].pos || '';

    setTimeout(function () { desc.textContent = DATA[i].soon ? 'Catalogue coming soon. ' + DATA[i].desc : DATA[i].desc; desc.style.opacity = 1; }, 250);
  }

  function fill(i) {
    var d = DATA[i];
    pTitle.textContent = d.title;
    grid.scrollTop = 0;
    if (window.ethChips) window.ethChips(i);
    if (d.soon) { grid.innerHTML = '<p class="eth__soon">Catalogue coming soon.<br><span>Every ' + (d.one || d.title.replace(/s$/, '').toLowerCase()) + ' is still made to order. <a href="./index.html#contact">Book an appointment</a> to have yours cut.</span></p>'; void grid.offsetWidth; grid.classList.add('show'); return; }
    grid.innerHTML = d.items.map(function (it, k) {
      var pics = Array.isArray(it[1]) ? it[1] : [it[1]];
      var imgs = pics.map(function (src, j) {
        return '<img src="' + src + '" alt="' + it[0] + (pics.length > 1 ? ', view ' + (j + 1) : '') + '"' + (j ? ' loading="lazy"' : '') + '>';
      }).join('');
      return '<a class="eth__card" href="#" style="--i:' + k + '" data-k="' + k + '">' +
             '<figure><div class="eth__slides">' + imgs + '</div></figure><hr><h3>' + it[0] + '</h3></a>';
    }).join('');
    setupSlides(d);
    grid.scrollTop = 0;
    void grid.offsetWidth;
    grid.classList.add('show');
  }
  function setupSlides(d) {
    grid.querySelectorAll('.eth__card').forEach(function (card) {
      var k = +card.dataset.k;
      var track = card.querySelector('.eth__slides');
      var n = track.children.length, cur = 0, timer = null;
      function go(x) { cur = (x + n) % n; track.style.transform = 'translateX(' + (-cur * 100) + '%)'; }
      card._cycle = n > 1 ? function (on) { clearInterval(timer); if (on) timer = setInterval(function () { go(cur + 1); }, 1600); else go(0); } : null;
      if (n > 1) {
        card.addEventListener('mouseenter', function () { clearInterval(timer); go(cur + 1); timer = setInterval(function () { go(cur + 1); }, 1500); });
        card.addEventListener('mouseleave', function () { clearInterval(timer); go(0); });
      }
      card._go = go; card._cur = function () { return cur; }; card._n = n;
      if (window.ethPhone && window.ethPhone.matches) { card._cycle = null; if (window.ethCard) window.ethCard(card, d, k); }
      card.addEventListener('click', function (e) {
        e.preventDefault();
        clearInterval(timer);
        if (card._swiped) { card._swiped = false; return; }

  /* ── lightbox: big view of one outfit ── */
  var lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbName = document.getElementById('lbName'),
      lbCount = document.getElementById('lbCount'), lbThumbs = document.getElementById('lbThumbs'), lbPics = [], lbCur = 0;
  function lbShow(x) {
    lbCur = (x + lbPics.length) % lbPics.length;

  }
  function lbOpen(name, pics, start) {

  document.getElementById('lbPrev').addEventListener('click', function () { lbShow(lbCur - 1); });
  document.getElementById('lbNext').addEventListener('click', function () { lbShow(lbCur + 1); });
  lb.addEventListener('click', function (e) { if (e.target === lb || e.target.classList.contains('lb__stage')) lbClose(); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') { e.stopImmediatePropagation(); lbClose(); }

    if (e.key === 'ArrowLeft') lbShow(lbCur - 1);

  var lbX = 0;
  lb.addEventListener('touchstart', function (e) { lbX = e.touches[0].clientX; }, { passive: true });

  function open(i) {
    activate(i);
    if (i === openIdx) return;
    var wasOpen = openIdx > -1;
    openIdx = i;

  }
  window.ethOpenStyle = function (i) { open(i); };
  window.ethChips = function (i) {
    var box = document.getElementById('ethChips'); if (!box) return;
    if (!box.children.length) {
      box.innerHTML = DATA.map(function (x, k) { return '<button type="button" data-k="' + k + '">' + x.title + '</button>'; }).join('');
      box.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) open(+b.dataset.k); });
    }
    Array.prototype.forEach.call(box.children, function (b, k) { b.classList.toggle('on', k === i); if (k === i && b.scrollIntoView) b.scrollIntoView({ inline: 'center', block: 'nearest' }); });
  };
  function close() {
    stage.classList.remove('is-open');
    grid.classList.remove('show');
    panel.setAttribute('aria-hidden', 'true');
    Array.prototype.forEach.call(list.children, function (li) { li.classList.remove('opened'); });
    openIdx = -1;
  }
  // while the panel is open, leaving the titles brings the background back to the opened style
  list.addEventListener('mouseleave', function () { if (openIdx > -1) activate(openIdx); });
  document.getElementById('ethClose').addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

  // start: first style shown, titles pan in 150ms apart; #kurtas etc. in the link opens that style
  var start = Math.max(0, DATA.findIndex(function (d) { return '#' + d.id === location.hash; }));
  layers[0].style.backgroundImage = 'url("' + DATA[start].bg + '")';
  current = -1; front = 0;
  activate(start);
  window.ethReady = function () { stage.classList.add('is-ready'); };
  // phones: until a style is picked, the backgrounds take turns on their own
  (function () {
    if (!matchMedia('(max-width:760px)').matches || location.hash || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    var withBg = DATA.map(function (d, k) { return d.bg ? k : -1; }).filter(function (k) { return k > -1; });
    if (withBg.length < 2) return;
    var pos = Math.max(0, withBg.indexOf(start)), auto = setInterval(function () {
      if (document.hidden || openIdx > -1) return;
      pos = (pos + 1) % withBg.length; activate(withBg[pos]);
    }, 3600);
    function stopAuto() { if (auto) { clearInterval(auto); auto = null; } }
    list.addEventListener('click', stopAuto, true);
    panel.addEventListener('click', stopAuto, true);
  })();
})();
</script>
<script>
/* loading screen: counts to 100%, then splits open and starts the title animation */
(function () {
  var pl = document.getElementById('pl'), pct = document.getElementById('plPct');
  var n = 0, loaded = false, t0 = Date.now();
  window.addEventListener('load', function () { loaded = true; });
  (function tick() {
    var cap = loaded ? 100 : 90;
    n += Math.max(1, (cap - n) * 0.08);
    if (n > cap) n = cap;
    pct.textContent = Math.round(n) + '%';
    if (n >= 100 && Date.now() - t0 > 1400) {
      pl.classList.add('is-done');
      setTimeout(function () { if (window.ethReady) window.ethReady(); }, 450);
      setTimeout(function () { pl.classList.add('is-gone'); }, 1200);
      return;
    }
    requestAnimationFrame(tick);
  })();
})();

(function () {

    'html,body,a,button,input,select,label,[role=button]{cursor:none!important}' +
    '.glass-cursor{position:fixed;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:2px;pointer-events:none;z-index:' + (wt.zIndex + 1) + ';' +
    'opacity:0;transition:opacity .3s,width .3s,height .3s,margin .3s;background:none!important;border:1.5px solid #fff!important;mix-blend-mode:difference}' +
    '.glass-cursor.on{opacity:1}' +
    '.glass-cursor.big{width:26px;height:26px;margin:-13px 0 0 -13px}';
  document.head.appendChild(st);

  /* keep the cursor above everything (same trick as the main site) */
  e.popover = 'manual'; i.popover = 'manual';

  Object.assign(i.style, { padding: '0', right: 'auto', bottom: 'auto', overflow: 'visible' });
  function top() { [e, i].forEach(function (M) { try { M.hidePopover && M.hidePopover(); M.showPopover && M.showPopover(); } catch (x) {} }); }
  top();

  size();

  var g = 0, d = 0, m = 0, alpha = 0, speed = 0;

  function loop(M) {
    g = 0;
    var R = Math.min((M - d) / 1e3, 1 / 30) || 1 / 60; d = M;
    var O = function (A) { return 1 - Math.pow(1 - A, R * 60); }, I = f[0].x, q = f[0].y;
    f[0].x += (u.x - f[0].x) * O(wt.follow); f[0].y += (u.y - f[0].y) * O(wt.follow);
    for (var A = 1; A < f.length; A++) { f[A].x += (f[A - 1].x - f[A].x) * O(wt.drag); f[A].y += (f[A - 1].y - f[A].y) * O(wt.drag); }
    var S = Math.hypot(f[0].x - I, f[0].y - q);
    speed += (Math.min(S / 18, 1) - speed) * O(.15);
    var E = M - m > wt.fadeAfter ? 0 : 1;
    alpha += (E - alpha) * O(E ? .3 : .08);
    o.clearRect(0, 0, a, l);
    if (alpha > .01) draw(M);
    if (alpha > .01 || E) g = requestAnimationFrame(loop);
  }
  function draw(M) {
    var R = f.length, L = [], Rt = [];
    for (var E = 0; E < R; E++) {
      var A = f[Math.max(E - 1, 0)], V = f[Math.min(E + 1, R - 1)];
      var J = -(V.y - A.y), ut = V.x - A.x, Me = Math.hypot(J, ut) || 1; J /= Me; ut /= Me;
      var vt = E / (R - 1), St = Math.sin(M * wt.waveSpeed - E * .45) * wt.wave * vt * (.35 + speed);
      var x = f[E].x + J * St, y = f[E].y + ut * St, w = wt.width * (.25 + speed * .75) * Math.pow(1 - vt, .9) / 2;
      L.push([x + J * w, y + ut * w]); Rt.push([x - J * w, y - ut * w]);
    }
    var q = f[0], S = f[R - 1], P = o.createLinearGradient(q.x, q.y, S.x + .01, S.y + .01);
    COLORS.forEach(function (col, k) { P.addColorStop(COLORS.length === 1 ? 0 : k / (COLORS.length - 1), col); });
    o.globalAlpha = alpha; o.fillStyle = P; o.beginPath(); o.moveTo(L[0][0], L[0][1]);
    for (var k = 1; k < R; k++) o.lineTo(L[k][0], L[k][1]);

  }
  function wake() { m = performance.now(); if (!g) { d = performance.now(); g = requestAnimationFrame(loop); } }
  addEventListener('pointermove', function (M) {
    if (M.pointerType === 'touch') return;
    u.x = M.clientX; u.y = M.clientY;
    i.style.transform = 'translate3d(' + M.clientX + 'px,' + M.clientY + 'px,0)';
    i.classList.add('on');
    i.classList.toggle('big', !!(M.target.closest && M.target.closest('a,button,[data-view],.tab')));
    if (!u.ready) { u.ready = true; f.forEach(function (p) { p.x = u.x; p.y = u.y; }); }
    wake();

})();
