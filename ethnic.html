<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ethnic Wear | Prasads Bespoke</title>
<meta name="description" content="Kurtas, sherwanis, jodhpuris, modi coats, bandhgalas and indo-western, made to your measure by Prasads Bespoke.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap">
<style>
  :root{
    --ink:#0c0805; --gold:#d9b48a; --gold-2:#e8cfae; --gold-deep:#b08d66;
    --white:#ffffff; --muted:rgba(255,255,255,.62); --dim:rgba(255,255,255,.28);
    --serif:"Cormorant Garamond",serif; --sans:"Montserrat",sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;overflow-x:clip;height:100%;background:var(--ink);color:var(--white);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

  /* ── stage ── */
  .eth{position:relative;overflow:clip;height:100vh;height:100svh;min-height:600px}
  .eth__bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.08);
    transition:opacity 1.1s ease,transform 6s ease}
  .eth__bg.on{opacity:1;transform:scale(1)}
  .eth__shade{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to right,rgba(12,8,5,.88) 0%,rgba(12,8,5,.55) 40%,rgba(12,8,5,.15) 75%,rgba(12,8,5,.35) 100%),
               linear-gradient(to bottom,rgba(12,8,5,.55) 0%,rgba(12,8,5,0) 25%,rgba(12,8,5,0) 70%,rgba(12,8,5,.6) 100%)}

  /* ── top bar ── */
  .eth__bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:26px 5vw}
  .eth__back{display:inline-flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);transition:color .3s}
  .eth__back:hover{color:var(--white)}
  .eth__back i{width:34px;height:34px;border:1px solid rgba(255,255,255,.35);border-radius:50%;display:grid;place-items:center;font-style:normal}
  .eth__brand{display:flex;flex-direction:column;align-items:center;line-height:1}
  .eth__brand b{font-family:var(--serif);font-weight:400;font-size:clamp(22px,2vw,30px);letter-spacing:.06em}
  .eth__brand small{font-size:8px;letter-spacing:.6em;margin-right:-.6em;margin-top:6px}
  .eth__book{font-size:11px;letter-spacing:.3em;text-transform:uppercase;padding:12px 22px;border:1px solid rgba(232,207,174,.55);border-radius:999px;transition:background .3s,color .3s}
  .eth__book:hover{background:var(--gold-2);color:var(--ink)}

  /* ── left info ── */
  .eth__info{position:absolute;right:5vw;bottom:9vh;z-index:3;max-width:36vw;text-align:right}
  .eth__eye{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
  .eth__count{font-family:var(--serif);font-size:clamp(54px,6vw,96px);line-height:1;margin:14px 0 10px;font-weight:300}
  .eth__count span{font-size:.38em;color:var(--muted)}
  .eth__desc{font-family:var(--serif);font-style:italic;font-size:clamp(17px,1.4vw,22px);line-height:1.45;color:var(--muted);margin:0;min-height:3em;transition:opacity .4s}

  /* ── right title list ── */
  .eth__list{position:absolute;left:5vw;top:50%;transform:translateY(-46%);z-index:3;list-style:none;margin:0;padding:0;text-align:left;
    transition:opacity .5s ease,transform .6s var(--ease)}
  .eth.is-open .eth__info{opacity:0;pointer-events:none}
  .eth__info{transition:opacity .5s ease}
  .eth__item{opacity:0;transform:translateX(60px);transition:opacity .7s ease,transform .9s var(--ease);transition-delay:calc(var(--i) * 150ms)}
  .eth.is-ready .eth__item{opacity:1;transform:none}
  .eth__t{display:inline-flex;align-items:baseline;gap:18px;font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.2vw,56px);line-height:1.08;color:var(--white);transition:color .4s,opacity .4s,transform .5s var(--ease)}
  .eth__t sup{font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--gold);transform:translateY(-1.6em)}
  .eth__list.has-active .eth__t{opacity:.32}
  .eth__item.active .eth__t{opacity:1;color:var(--gold-2);transform:translateX(14px)}
  .eth__more{display:block;margin-right:auto;overflow:hidden;max-height:0;opacity:0;transition:max-height .5s var(--ease),opacity .4s ease,margin .5s var(--ease)}
  .eth__item.active .eth__more{max-height:40px;opacity:1;margin:4px auto 14px 14px}
  .eth__more span{display:inline-flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--white);padding-bottom:6px;border-bottom:1px solid var(--gold)}
  .eth__more span::after{content:"→";letter-spacing:0;transition:transform .3s}
  .eth__more:hover span::after{transform:translateX(5px)}

  /* ── product panel (left half) ── */
  .eth__panel{position:absolute;top:0;right:0;bottom:0;width:68%;z-index:4;padding:110px 4vw 0 9vw;display:flex;flex-direction:column;
    background:rgba(12,8,5,.45);-webkit-backdrop-filter:blur(18px) saturate(130%);backdrop-filter:blur(18px) saturate(130%);
    border:0;-webkit-mask-image:linear-gradient(to right,transparent 0%,#000 16%);mask-image:linear-gradient(to right,transparent 0%,#000 16%);
    transform:translateX(100%);visibility:hidden;transition:transform .8s var(--ease),visibility 0s linear .8s}
  .eth.is-open .eth__panel{transform:none;visibility:visible;transition:transform .8s var(--ease)}
  .eth__ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
  .eth__ph h2{transition:opacity .3s;font-family:var(--serif);font-weight:400;font-size:clamp(34px,3.4vw,56px);line-height:1;margin:6px 0 0}
  .eth__close{width:44px;height:44px;flex:none;border:1px solid rgba(255,255,255,.35);border-radius:50%;display:grid;place-items:center;font-size:18px;transition:background .3s,color .3s}
  .eth__close:hover{background:var(--gold-2);color:var(--ink)}
  .eth__grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:auto;align-content:start;gap:40px 24px;overflow-y:auto;overscroll-behavior:contain;padding:0 12px 80px 0;scrollbar-width:thin;scrollbar-color:rgba(232,207,174,.45) transparent;-webkit-mask-image:linear-gradient(to bottom,#000 86%,transparent 100%);mask-image:linear-gradient(to bottom,#000 86%,transparent 100%)}
  .eth__card{display:block;opacity:0;transform:translateY(30px);transition:opacity .6s ease,transform .8s var(--ease)}
  .eth__grid.show .eth__card{opacity:1;transform:none;transition-delay:calc(.2s + min(var(--i), 5) * 150ms)}
  .eth__item.opened .eth__t{color:var(--gold-2)}
  .eth__card figure{position:relative;height:0;padding-bottom:160%;margin:0;overflow:hidden;border-radius:4px}
  .eth__card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease)}
  .eth__card:hover img{transform:scale(1.06)}
  .eth__card hr{border:0;height:1px;margin:14px 0 10px;background:linear-gradient(90deg,var(--gold-deep),var(--gold-2),var(--gold-deep))}
  .eth__card h3{font-family:var(--serif);font-weight:400;font-size:clamp(17px,1.35vw,22px);margin:0;letter-spacing:.02em}

  /* ── phones ── */
  @media (max-width:760px){
    .eth__bar{padding:18px 20px}
    .eth__back b,.eth__book{display:none}
    .eth__info{left:20px;right:20px;bottom:auto;top:92px;max-width:none;text-align:left}
    .eth__count{font-size:44px;margin:8px 0 4px}
    .eth__desc{font-size:15px;min-height:0}
    .eth__shade{background:linear-gradient(to bottom,rgba(12,8,5,.75) 0%,rgba(12,8,5,.35) 45%,rgba(12,8,5,.85) 100%)}
    .eth__list{right:20px;left:20px;top:auto;bottom:6vh;transform:none}
    .eth__t{font-size:38px}
    .eth.is-open .eth__t{font-size:24px}
    .eth.is-open .eth__more,.eth.is-open .eth__t sup{display:none}
    .eth__brand{position:absolute;left:50%;transform:translateX(-50%)}
    .eth__panel{width:100%;bottom:auto;height:60%;padding:80px 20px 16px;border-right:0;border-bottom:0;transform:translateY(-100%);-webkit-mask-image:linear-gradient(to bottom,#000 82%,transparent 100%);mask-image:linear-gradient(to bottom,#000 82%,transparent 100%)}
    .eth__ph{margin-bottom:14px}
    .eth__ph h2{font-size:28px}
    .eth__grid{gap:22px 12px;grid-template-columns:repeat(2,1fr)}
    .eth__card hr{margin:8px 0 6px}
    .eth__card h3{font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important}}
</style>
<style>
  /* ── loading screen ── */
  .pl{position:fixed;inset:0;z-index:100;pointer-events:none}
  .pl__half{position:absolute;top:0;bottom:0;width:50.5%;background:#0c0805;transition:transform 1.1s cubic-bezier(.77,0,.18,1)}
  .pl__half.--l{left:0}.pl__half.--r{right:0}
  .pl.is-done .pl__half.--l{transform:translateX(-100%)}
  .pl.is-done .pl__half.--r{transform:translateX(100%)}
  .pl__brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;text-align:center;white-space:nowrap;transition:opacity .5s ease}
  .pl.is-done .pl__brand,.pl.is-done .pl__pct{opacity:0}
  .pl__brand > span{opacity:0;animation:plRise 1.1s cubic-bezier(.22,1,.36,1) forwards}
  .pl__name{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(40px,7vw,104px);line-height:1;letter-spacing:.04em;background:linear-gradient(100deg,#d8b48a 0%,#f3dcc0 45%,#c9a07a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .pl__sub{font-family:"Montserrat",sans-serif;font-weight:300;font-size:clamp(11px,1.4vw,22px);letter-spacing:.62em;margin-right:-.62em;margin-top:clamp(8px,1vw,18px);color:#ead6bf;animation-delay:150ms!important}
  .pl__tag{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(9px,.8vw,13px);text-transform:uppercase;letter-spacing:.28em;margin-right:-.28em;margin-top:clamp(14px,1.8vw,30px);color:#bfa182;animation-delay:300ms!important}
  .pl__pct{position:absolute;left:50%;bottom:8vh;transform:translateX(-50%);font-family:"Montserrat",sans-serif;font-size:11px;letter-spacing:.32em;color:#bfa182;transition:opacity .4s ease}
  .pl.is-gone{display:none}
  @keyframes plRise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}

  /* ── custom cursor (mouse only) ── */
  .cur,.cur__ring{display:none}
  @media (hover:hover) and (pointer:fine){
    *,*::before,*::after{cursor:none!important}
    .cur,.cur__ring{display:block;position:fixed;left:0;top:0;z-index:200;pointer-events:none;will-change:transform}
    .cur{display:none!important}
    .cur__ring{width:20px;height:20px;margin:-19px 0 0 -19px;border-radius:50%;border:1px solid rgba(232,207,174,.6);
      transition:width .35s cubic-bezier(.22,1,.36,1),height .35s cubic-bezier(.22,1,.36,1),margin .35s cubic-bezier(.22,1,.36,1),background .35s ease,border-color .35s ease,opacity .3s ease}
    .cur__ring.is-hover{width:40px;height:40px;margin:-35px 0 0 -35px;background:rgba(232,207,174,.12);border-color:rgba(232,207,174,.9)}
    .cur__ring.is-down{width:28px;height:28px;margin:-14px 0 0 -14px}
    .cur.is-hide,.cur__ring.is-hide{opacity:0}
  }
</style>
<style>
  /* hide every scrollbar (scrolling still works) */
  html, body, * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
  html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
</style>
</head>
<body>
<div class="pl" id="pl" aria-hidden="true">
  <div class="pl__half --l"></div><div class="pl__half --r"></div>
  <div class="pl__brand"><span class="pl__name">PRASAD’S</span><span class="pl__sub">BESPOKE</span><span class="pl__tag">Hyderabad’s finest handcrafted couture</span></div>
  <div class="pl__pct" id="plPct">0%</div>
</div>
<div class="cur" id="cur"></div><div class="cur__ring" id="curRing"></div>
<section class="eth" id="eth" aria-label="Ethnic wear collection">
  <div class="eth__bg on" data-layer></div>
  <div class="eth__bg" data-layer></div>
  <div class="eth__shade"></div>

  <header class="eth__bar">
    <a class="eth__back" href="./index.html"><i>←</i><b>Back to the house</b></a>
    <a class="eth__brand" href="./index.html" aria-label="Prasad's Bespoke, home"><b>PRASAD’S</b><small>BESPOKE</small></a>
    <a class="eth__book" href="./index.html#contact">Book a fitting</a>
  </header>

  <div class="eth__info">
    <div class="eth__eye">Ethnic collection</div>
    <div class="eth__count"><b id="ethNum">01</b> <span>/ 06</span></div>
    <p class="eth__desc" id="ethDesc"></p>
  </div>

  <ul class="eth__list" id="ethList"></ul>

  <aside class="eth__panel" id="ethPanel" aria-hidden="true">
    <div class="eth__ph">
      <div><div class="eth__eye">The selection</div><h2 id="ethPanelTitle"></h2></div>
      <button class="eth__close" id="ethClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="eth__grid" id="ethGrid"></div>
  </aside>
</section>

<script>
(function () {
  /* ───── EDIT YOUR CONTENT HERE ─────
     bg: big background photo for each style
     items: the 4 products shown after "Know more" (name + photo) */
  var DATA = [
    { id:'kurtas', title:'Kurtas', desc:'Easy, elegant and cut to you. From everyday linen to festive silk.',
      bg:'https://cdn.21st.dev/assets/mirror/b2/b26ed9367c41626c7e61d837f0ea11cdaa3148a499e6bee171176886c8959950.jpg',
      items:[['Ivory Chikankari Kurta','./images/hero_sherwani.webp'],['Linen Pathani Kurta','./images/c_suit.webp'],['Silk Festive Kurta','./images/c_sherwani.webp'],['Asymmetric Kurta Set','./images/rotate.webp']] },
    { id:'sherwanis', title:'Sherwanis', desc:'Zardozi, aari and resham work on silk and brocade, made for the day itself.',
      bg:'https://cdn.21st.dev/assets/mirror/40/4028a63d1229ffb5d2eccc4c4f7640858afb1bbf639fc41b9a86a376a1202555.jpg',
      items:[['Gold Zardozi Sherwani','./images/c_sherwani.webp'],['Ivory Raw-Silk Sherwani','./images/hero_sherwani.webp'],['Maroon Velvet Sherwani','./images/bride_red.webp'],['Pastel Embroidered Sherwani','./images/lace.webp']] },
    { id:'jodhpuris', title:'Jodhpuris', desc:'The royal cut. A sharp closed collar with a tailored, regal line.',
      bg:'https://cdn.21st.dev/assets/mirror/e6/e65a4e822aa4606715518071f6d85d2066b721b8e7e952e8ab6c051e87bc7a36.jpg',
      items:[['Black Tie Jodhpuri','./images/c_tux.webp'],['Navy Jodhpuri Suit','./images/f_navy.webp'],['Ivory Wedding Jodhpuri','./images/hero_sherwani.webp'],['Wine Velvet Jodhpuri','./images/f_satin.webp']] },
    { id:'modi-coats', title:'Modi Coats', desc:'A sleeveless layer that lifts any kurta, from office to celebration.',
      bg:'https://cdn.21st.dev/assets/mirror/87/87882922b01fff1934486f69e7ee39a5a5e05bf2b935bb03a916234be898ee0e.jpg',
      items:[['Linen Modi Coat','./images/chalk.webp'],['Jacquard Modi Coat','./images/c_sherwani.webp'],['Textured Wool Modi Coat','./images/f_navy.webp'],['Silk Brocade Modi Coat','./images/f_silk.webp']] },
    { id:'bandhgalas', title:'Bandhgalas', desc:'Indian formal at its finest. Structured, minimal and quietly grand.',
      bg:'https://cdn.21st.dev/assets/mirror/99/99ee55fd55281f879bd8cf899e4cb967a99a142d6b571765e46a88ad619ee9de.jpg',
      items:[['Midnight Bandhgala','./images/rotate.webp'],['Ivory Bandhgala','./images/hero_sherwani.webp'],['Textured Grey Bandhgala','./images/c_suit.webp'],['Embroidered Bandhgala','./images/c_sherwani.webp']] },
    { id:'indo-western', title:'Indo-Western', desc:'Tradition, recut. Drapes, capes and modern silhouettes for the new function.',
      bg:'https://cdn.21st.dev/assets/mirror/24/24ae667023524d2b6621597f09bf7062c9eadf03fe98d0f2c741637ede1131fc.jpg',
      items:[['Draped Indo-Western Set','./images/c_tux.webp'],['Asymmetric Jacket Set','./images/rotate.webp'],['Cape Kurta Set','./images/lace.webp'],['Structured Achkan','./images/c_sherwani.webp']] }
  ];

  var stage = document.getElementById('eth');
  var list = document.getElementById('ethList');
  var layers = stage.querySelectorAll('[data-layer]');
  var num = document.getElementById('ethNum');
  var desc = document.getElementById('ethDesc');
  var panel = document.getElementById('ethPanel');
  var grid = document.getElementById('ethGrid');
  var pTitle = document.getElementById('ethPanelTitle');
  var current = -1, front = 0, openIdx = -1;

  // preload backgrounds
  DATA.forEach(function (d) { var im = new Image(); im.src = d.bg; });

  // build the title list
  DATA.forEach(function (d, i) {
    var li = document.createElement('li');
    li.className = 'eth__item'; li.style.setProperty('--i', i); li.id = d.id;
    li.innerHTML = '<button type="button" class="eth__t"><sup>0' + (i + 1) + '</sup>' + d.title + '</button>' +
                   '<button type="button" class="eth__more" tabindex="-1"><span>Know more</span></button>';
    var t = li.querySelector('.eth__t'), more = li.querySelector('.eth__more');
    t.addEventListener('mouseenter', function () { activate(i); });
    t.addEventListener('focus', function () { activate(i); });
    t.addEventListener('click', function () {
      if (openIdx > -1) { open(i); return; }          // panel already open: switch straight to this style
      activate(i); more.focus({ preventScroll: true });
    });
    more.addEventListener('click', function () { open(i); });
    list.appendChild(li);
  });

  function activate(i) {
    if (i === current) return;
    current = i;
    list.classList.add('has-active');
    Array.prototype.forEach.call(list.children, function (li, k) {
      li.classList.toggle('active', k === i);
      li.querySelector('.eth__more').tabIndex = k === i ? 0 : -1;
    });
    var back = layers[1 - front];
    back.style.backgroundImage = 'url("' + DATA[i].bg + '")';
    back.classList.add('on'); layers[front].classList.remove('on'); front = 1 - front;
    num.textContent = ('0' + (i + 1)).slice(-2);
    desc.style.opacity = 0;
    setTimeout(function () { desc.textContent = DATA[i].desc; desc.style.opacity = 1; }, 250);
  }

  function fill(i) {
    var d = DATA[i];
    pTitle.textContent = d.title;
    grid.innerHTML = d.items.map(function (it, k) {
      return '<a class="eth__card" href="./index.html#contact" style="--i:' + k + '">' +
             '<figure><img src="' + it[1] + '" alt="' + it[0] + '" loading="lazy"></figure><hr><h3>' + it[0] + '</h3></a>';
    }).join('');
    void grid.offsetWidth;
    grid.classList.add('show');
  }
  function open(i) {
    activate(i);
    if (i === openIdx) return;
    var wasOpen = openIdx > -1;
    openIdx = i;
    Array.prototype.forEach.call(list.children, function (li, k) { li.classList.toggle('opened', k === i); });
    stage.classList.add('is-open');
    panel.setAttribute('aria-hidden', 'false');
    if (wasOpen) {                       // swap cards: fade old ones out, new ones rise in
      grid.classList.remove('show'); pTitle.style.opacity = 0;
      setTimeout(function () { fill(i); pTitle.style.opacity = 1; }, 300);
    } else {
      grid.classList.remove('show'); fill(i);
    }
  }
  function close() {
    stage.classList.remove('is-open');
    grid.classList.remove('show');
    panel.setAttribute('aria-hidden', 'true');
    Array.prototype.forEach.call(list.children, function (li) { li.classList.remove('opened'); });
    openIdx = -1;
  }
  // while the panel is open, leaving the titles brings the background back to the opened style
  list.addEventListener('mouseleave', function () { if (openIdx > -1) activate(openIdx); });
  document.getElementById('ethClose').addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

  // start: first style shown, titles pan in 150ms apart; #kurtas etc. in the link opens that style
  var start = Math.max(0, DATA.findIndex(function (d) { return '#' + d.id === location.hash; }));
  layers[0].style.backgroundImage = 'url("' + DATA[start].bg + '")';
  current = -1; front = 0;
  activate(start);
  window.ethReady = function () { stage.classList.add('is-ready'); };
})();
</script>
<script>
/* loading screen: counts to 100%, then splits open and starts the title animation */
(function () {
  var pl = document.getElementById('pl'), pct = document.getElementById('plPct');
  var n = 0, loaded = false, t0 = Date.now();
  window.addEventListener('load', function () { loaded = true; });
  (function tick() {
    var cap = loaded ? 100 : 90;
    n += Math.max(1, (cap - n) * 0.08);
    if (n > cap) n = cap;
    pct.textContent = Math.round(n) + '%';
    if (n >= 100 && Date.now() - t0 > 1400) {
      pl.classList.add('is-done');
      setTimeout(function () { if (window.ethReady) window.ethReady(); }, 450);
      setTimeout(function () { pl.classList.add('is-gone'); }, 1200);
      return;
    }
    requestAnimationFrame(tick);
  })();
})();

/* custom cursor: dot + trailing ring that grows over links and buttons */
(function () {
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  var dot = document.getElementById('cur'), ring = document.getElementById('curRing');
  var x = innerWidth / 2, y = innerHeight / 2, rx = x, ry = y;
  addEventListener('mousemove', function (e) {
    x = e.clientX; y = e.clientY;
    dot.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    dot.classList.remove('is-hide'); ring.classList.remove('is-hide');
  });
  document.addEventListener('mouseleave', function () { dot.classList.add('is-hide'); ring.classList.add('is-hide'); });
  addEventListener('mousedown', function () { ring.classList.add('is-down'); });
  addEventListener('mouseup', function () { ring.classList.remove('is-down'); });
  document.addEventListener('mouseover', function (e) { ring.classList.toggle('is-hover', !!e.target.closest('a,button')); });
  (function loop() {
    rx += (x - rx) * 0.18; ry += (y - ry) * 0.18;
    ring.style.transform = 'translate(' + rx + 'px,' + ry + 'px)';
    requestAnimationFrame(loop);
  })();
})();
